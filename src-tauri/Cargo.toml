[package]
name = "contextflow"
version = "0.3.0"
description = "업무 맥락 유지 및 지식 관리 도구"
authors = ["ContextFlow"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "contextflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` 은 HTML 뷰어가 파일을 asset: 로 직접 읽기 위한 것이다. srcdoc 과 달리
# 별도 출처로 뜨므로 앱 창의 CSP 를 물려받지 않고, 그래서 문서 안의 <script> 가 실제로 돈다.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"
urlencoding = "2"
# 탐지 단계의 `--version` 프로브가 멈춘 CLI 에 매달리지 않도록 대기에 상한을 건다.
wait-timeout = "0.2"
# 원격 AI 서비스(AI Pro · FabriX)용. blocking 은 이 앱의 워커 스레드 관례와 맞고
# (IPC 스레드에서는 절대 호출하지 않는다), native-tls 는 Windows 에서 schannel 이라
# OS 인증서 저장소 — 사내 TLS 검사 프록시의 CA 가 사는 곳 — 를 그대로 신뢰한다.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
