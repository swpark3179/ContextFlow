[package]
name = "contextflow"
version = "0.3.0"
description = "업무 맥락 유지 및 지식 관리 도구"
authors = ["ContextFlow"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "contextflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
walkdir = "2"
urlencoding = "2"
ureq = { version = "2", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
